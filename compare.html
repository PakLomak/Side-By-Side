<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="referrer"
        content="no-referrer-when-downgrade"
    >

    <title>YouTube / Twitch Sync Compare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         ПОЛЯ ДЛЯ ВИДЕО
         ===================================================== -->

    <div class="inputs-container">


        <!-- ================= VIDEO 1 ================= -->

        <div class="input-group">

            <textarea
                id="code1"
                placeholder="Вставьте ссылку YouTube или Twitch для Видео 1"
            ></textarea>


            <div class="time-input-block">

                <span>Начать с:</span>


                <input
                    type="number"
                    id="min1"
                    value="0"
                    min="0"
                >

                <span>мин</span>


                <input
                    type="number"
                    id="sec1"
                    value="0"
                    min="0"
                    max="59"
                >

                <span>сек</span>


                <input
                    type="number"
                    id="cs1"
                    value="0"
                    min="0"
                    max="999"
                    step="1"
                >

                <span>мс</span>

            </div>


            <button
                class="btn-load"
                onclick="loadEmbedVideo(1)"
            >
                Открыть Видео 1
            </button>

        </div>



        <!-- ================= VIDEO 2 ================= -->

        <div class="input-group">

            <textarea
                id="code2"
                placeholder="Вставьте ссылку YouTube или Twitch для Видео 2"
            ></textarea>


            <div class="time-input-block">

                <span>Начать с:</span>


                <input
                    type="number"
                    id="min2"
                    value="0"
                    min="0"
                >

                <span>мин</span>


                <input
                    type="number"
                    id="sec2"
                    value="0"
                    min="0"
                    max="59"
                >

                <span>сек</span>


                <input
                    type="number"
                    id="cs2"
                    value="0"
                    min="0"
                    max="999"
                    step="1"
                >

                <span>мс</span>

            </div>


            <button
                class="btn-load"
                onclick="loadEmbedVideo(2)"
            >
                Открыть Видео 2
            </button>

        </div>

    </div>



    <!-- =====================================================
         ОСНОВНЫЕ КНОПКИ
         ===================================================== -->

    <div class="controls main-controls">


        <button
            class="btn-control btn-play"
            onclick="syncPlay()"
        >
            ▶ СИНХРО СТАРТ
        </button>


        <button
            class="btn-control btn-pause"
            onclick="syncPause()"
        >
            ❚❚ ПАУЗА
        </button>


        <button
            class="btn-control btn-stop"
            onclick="syncStop()"
        >
            ◼ В НАЧАЛО
        </button>


        <button
            class="btn-control btn-toggle-timers"
            onclick="toggleTimersVisibility()"
        >
            👁 ТАЙМЕРЫ
        </button>

    </div>



    <!-- =====================================================
         РАСКЛАДКА
         ===================================================== -->

    <div class="controls layout-selector">


        <span
            style="
                align-self: center;
                font-weight: bold;
                color: #aaa;
            "
        >
            Вид экрана:
        </span>


        <button
            class="btn-layout active"
            onclick="changeLayout('side')"
        >
            ❖ Рядом (50/50)
        </button>


        <button
            class="btn-layout"
            onclick="changeLayout('large')"
        >
            🔎 Крупно (100%)
        </button>


        <button
            class="btn-layout"
            onclick="changeLayout('vertical')"
        >
            ☰ Друг под другом
        </button>

    </div>



    <!-- =====================================================
         ПЕРЕМОТКА НАЗАД
         ===================================================== -->

    <div class="controls rew-controls">


        <button
            class="btn-rew"
            onclick="syncRewind(0.01)"
        >
            -0.01 сек
        </button>


        <button
            class="btn-rew"
            onclick="syncRewind(0.1)"
        >
            -0.1 сек
        </button>


        <button
            class="btn-rew"
            onclick="syncRewind(1)"
        >
            -1 сек
        </button>


        <button
            class="btn-rew"
            onclick="syncRewind(5)"
        >
            -5 сек
        </button>


        <button
            class="btn-rew"
            onclick="syncRewind(10)"
        >
            -10 сек
        </button>

    </div>



    <!-- =====================================================
         ПЕРЕМОТКА ВПЕРЕД
         ===================================================== -->

    <div class="controls fwd-controls">


        <button
            class="btn-fwd"
            onclick="syncForward(0.01)"
        >
            +0.01 сек
        </button>


        <button
            class="btn-fwd"
            onclick="syncForward(0.1)"
        >
            +0.1 сек
        </button>


        <button
            class="btn-fwd"
            onclick="syncForward(1)"
        >
            +1 сек
        </button>


        <button
            class="btn-fwd"
            onclick="syncForward(5)"
        >
            +5 сек
        </button>


        <button
            class="btn-fwd"
            onclick="syncForward(10)"
        >
            +10 сек
        </button>

    </div>



    <!-- =====================================================
         ВИДЕО
         ===================================================== -->

    <div
        id="video-grid"
        class="video-container layout-side"
    >


        <div class="player-column">


            <div
                id="timer-display-1"
                class="high-res-timer"
            >
                00:00.000
            </div>


            <div
                id="player1"
                class="player-box"
            ></div>


        </div>



        <div class="player-column">


            <div
                id="timer-display-2"
                class="high-res-timer"
            >
                00:00.000
            </div>


            <div
                id="player2"
                class="player-box"
            ></div>


        </div>


    </div>



    <!-- =====================================================
         ПЕРЕКЛЮЧЕНИЕ РАСКЛАДКИ
         ===================================================== -->

    <script>

        function changeLayout(mode) {


            const grid =
                document.getElementById(
                    'video-grid'
                );


            grid.className =
                "video-container";


            if (mode === 'side') {

                grid.classList.add(
                    'layout-side'
                );

            }


            if (mode === 'large') {

                grid.classList.add(
                    'layout-large'
                );

            }


            if (mode === 'vertical') {

                grid.classList.add(
                    'layout-vertical'
                );

            }


            document
                .querySelectorAll('.btn-layout')
                .forEach(function(button) {

                    button.classList.remove(
                        'active'
                    );

                });


            const buttons =
                document.querySelectorAll(
                    '.btn-layout'
                );


            const modeIndex = {

                side: 0,

                large: 1,

                vertical: 2

            }[mode];


            if (buttons[modeIndex]) {

                buttons[modeIndex]
                    .classList.add('active');

            }

        }

    </script>



    <!-- =====================================================
         TWITCH PLAYER API
         ===================================================== -->

    <script src="https://player.twitch.tv/js/embed/v1.js"></script>



    <!-- =====================================================
         ОСНОВНОЙ JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>


</body>

</html>
